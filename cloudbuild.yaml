apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: dropbox-indexer-worker
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        # Conexión a tu instancia de SQL (Proyecto:Region:Instancia)
        run.googleapis.com/cloudsql-instances: ortega-473114:us-central1:dropbox-indexer
        # Escala a 0 para ahorrar dinero si no hay tareas
        autoscaling.knative.dev/minScale: "0"
        # Límite de seguridad inicial (puedes subirlo luego)
        autoscaling.knative.dev/maxScale: "20"
    spec:
      containerConcurrency: 1 # Un worker = Una carpeta
      timeoutSeconds: 900     # 15 minutos máximo por carpeta
      # La cuenta de servicio que creamos en el Paso 2
      serviceAccountName: dropbox-indexer-sa@ortega-473114.iam.gserviceaccount.com
      containers:
      - image: gcr.io/ortega-473114/dropbox-indexer:v1
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            cpu: "1000m"
            memory: "2Gi"
        env:
        # Variables Normales
        - name: TOKEN_SERVICE_URL
          value: "https://accesstokendropbox-223080314602.us-central1.run.app"
        - name: GCP_PROJECT_ID
          value: "ortega-473114"
        - name: PUBSUB_TOPIC_NAME
          value: "dropbox-crawl-tasks"
        - name: LOG_LEVEL
          value: "INFO"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: dropbox-db-url
              key: latest
        - name: API_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: dropbox-api-key
              key: latest